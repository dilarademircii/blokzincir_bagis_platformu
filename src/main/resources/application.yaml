
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/blokzincir_bagis_db
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

blockchain:
  rpc-url: ${BLOCKCHAIN_RPC_URL}
  contract-address: "0x1E857D23Af68ec39a39b3336f071AA5967A6724d"
